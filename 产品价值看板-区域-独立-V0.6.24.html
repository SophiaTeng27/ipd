<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>产品价值看板</title>
<!-- 自包含单文件：主题 / 数据 / 规则已内联；双页互跳请同时发送两个「-独立」文件 -->
<style>
/* 政法智慧法庭看板 · 教育看板配色（DESIGN.md §2.8 · 对齐 BGBU/教育/产品价值看板-区域.html）
   变量名与教育原型一致：--canvas / --surface / --ink / --muted / --blue / --positive / --negative ... */
:root {
  color-scheme: light;
  --canvas: #f5f6f9;
  --surface: #fff;
  --ink: #19212f;
  --muted: #5a6779;
  --subtle: #9faec1;
  --line: #e6eaf1;
  --divider: rgba(202, 213, 228, 0.36);
  --card-hover-fill: rgba(202, 213, 228, 0.3);
  --blue: #3e79f0;
  --selected: #eaf0ff;
  --radius: 9px;
  --panel-radius: 8px;
  --metric-radius: 8px;
  --control: #eef0f5;
  --metric: #f6f8fc;
  --pending: #fafbfc;
  --metric-border: #edf0f6;
  --on-selected: #214cae;
  --icon-bg: #e5edff;
  --positive: #26aa66;
  --negative: #e9585c;
  --decline: #f09d1a;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-num: "DouyinSans", "PingFang SC", "Microsoft YaHei", sans-serif;
  --gradient-brand: linear-gradient(90deg, #006ab7 0%, #008cd3 50%, #21b8c5 100%);
  --chart-series: var(--blue);
  --chart-line: #e8eef6;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --panel-radius: 16px;
  --canvas: #171b25;
  --surface: #212634;
  --ink: #e9edf5;
  --muted: #acb6c8;
  --subtle: #a2afc3;
  --line: #384154;
  --divider: rgba(202, 213, 228, 0.12);
  --card-hover-fill: #38445a;
  --selected: #283c66;
  --control: #30394c;
  --metric: #262d3d;
  --pending: #242a37;
  --metric-border: #343d50;
  --on-selected: #c5d5ff;
  --icon-bg: #2c406a;
  --chart-series: var(--blue);
  --chart-line: var(--line);
}

* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font: 14px/1.5 var(--font);
}
h1, h2, h3, p, dl, dd { margin: 0; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
:root:has(dialog[open]) { overflow: hidden; overscroll-behavior: none; }

/* ───────── 通用控件 ───────── */
.zhifa-select, .zhifa-btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 0 14px; height: 40px;
  font: inherit; cursor: pointer;
}
select.zhifa-select {
  padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--subtle) 50%), linear-gradient(135deg, var(--subtle) 50%, transparent 50%);
  background-position: calc(100% - 17px) 17px, calc(100% - 12px) 17px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
.zhifa-btn { display: inline-flex; align-items: center; justify-content: center; }
.zhifa-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.zhifa-btn.ghost, .zhifa-btn.reset { background: var(--control); border-color: transparent; }
.zhifa-btn.small { height: 32px; padding: 0 10px; }
.zhifa-btn:hover { filter: brightness(0.97); }
.zhifa-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.zhifa-btn.linkish {
  height: 28px; padding: 0 10px; font-size: 13px; color: var(--blue);
  border-color: transparent; background: color-mix(in srgb, var(--blue) 10%, var(--surface));
}
.zhifa-btn.linkish:hover { background: color-mix(in srgb, var(--blue) 18%, var(--surface)); filter: none; }
a.zhifa-btn { text-decoration: none; }
.zhifa-select:focus-visible, .zhifa-btn:focus-visible, .bg-tab:focus-visible,
.side-nav a:focus-visible, .metric[role="button"]:focus-visible, .detail-close:focus-visible,
.theme-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.theme-toggle {
  flex: none; min-width: 32px; padding: 0 8px; white-space: nowrap; height: 32px; border: 0; border-radius: 8px; background: var(--control);
  color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
}

/* ───────── 通用壳（产品详情页沿用） ───────── */
.zhifa-wrap { max-width: 1460px; margin: 0 auto; padding: 20px 24px 64px; }
.zhifa-wrap.narrow { max-width: 1280px; }
.brand-line { height: 3px; background: var(--gradient-brand); border-radius: 2px; margin-bottom: 16px; }
.zhifa-header { display: block; margin-bottom: 12px; }
.zhifa-title-block { display: flex; flex-direction: column; gap: 10px; }
.zhifa-title-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
.zhifa-header h1 { margin: 0; font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.025em; color: var(--ink); }
.zhifa-sub { color: var(--muted); font-size: 13px; }
.zhifa-head-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.role-lab { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

.zhifa-notice {
  background: var(--selected); color: var(--on-selected); border-radius: var(--metric-radius);
  padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
}
.zhifa-notice.inline {
  display: inline-block; margin: 0 0 0 auto; padding: 6px 10px; font-size: 12px; line-height: 18px;
  max-width: min(560px, 100%); vertical-align: middle;
}
.zhifa-card { background: var(--surface); border-radius: var(--panel-radius); padding: 18px 20px; margin-bottom: 16px; }
.zhifa-card h2 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
.zhifa-card .cap, .cap { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.zhifa-empty {
  padding: 28px; text-align: center; color: var(--subtle);
  border: 1px dashed var(--line); border-radius: var(--metric-radius); background: var(--pending);
}
.zhifa-empty.soft { padding: 16px; margin-top: 8px; }

.zhifa-badge {
  display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; line-height: 18px;
  border-radius: 4px; margin-left: 6px; vertical-align: middle;
}
.zhifa-badge.demo { background: color-mix(in srgb, var(--decline) 16%, var(--surface)); color: var(--decline); }
.zhifa-badge.inner { background: color-mix(in srgb, var(--negative) 14%, var(--surface)); color: var(--negative); }

.favorable { color: var(--positive); }
.unfavorable { color: var(--negative); }
.decline { color: var(--decline); }
.flat { color: var(--muted); }

/* ───────── 表格 ───────── */
.table-scroll { overflow-x: auto; }
/* 样板法院表：表内容器横纵滚动，才能稳定冻结首行 + 前 3 列（不锁死整页） */
.table-scroll.court-scroll {
  overflow: auto;
  max-height: min(560px, calc(100vh - 220px));
  border-radius: var(--metric-radius);
  border: 1px solid var(--divider);
  background: var(--surface);
}
.zhifa-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.zhifa-table th, .zhifa-table td {
  border-bottom: 1px solid var(--divider); padding: 9px 8px; text-align: left; vertical-align: middle;
}
.zhifa-table thead th {
  background: var(--metric); color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; border-bottom: 0;
}
.zhifa-table thead th:first-child { border-start-start-radius: var(--metric-radius); }
.zhifa-table thead th:last-child { border-start-end-radius: var(--metric-radius); }
.zhifa-table tbody td { white-space: nowrap; }
.zhifa-table td.num { text-align: right; }
.zhifa-table th.num { text-align: right; }
.zhifa-table tbody tr:hover { background: var(--card-hover-fill); }
.zhifa-table tr.is-active { background: var(--selected); }
.zhifa-table .cell-value { font-weight: 700; color: var(--ink); }
.zhifa-table .cell-value.favorable { color: var(--positive); }
.zhifa-table .cell-value.unfavorable { color: var(--negative); }

/* 样板法院表：冻结首行 + 前 3 列（省 / 市/区 / 法院）；窄表头换行 */
.zhifa-table.court-freeze {
  border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%;
}
.zhifa-table.court-freeze thead th {
  position: sticky; top: 0; z-index: 4;
  background: var(--metric);
  box-shadow: 0 1px 0 var(--divider);
}
.zhifa-table.court-freeze .sticky-c1,
.zhifa-table.court-freeze .sticky-c2,
.zhifa-table.court-freeze .sticky-c3 {
  position: sticky; z-index: 2; background: var(--surface);
}
.zhifa-table.court-freeze thead .sticky-c1,
.zhifa-table.court-freeze thead .sticky-c2,
.zhifa-table.court-freeze thead .sticky-c3 {
  top: 0; z-index: 6; background: var(--metric);
}
.zhifa-table.court-freeze .sticky-c1 { left: 0; min-width: 88px; width: 88px; }
.zhifa-table.court-freeze .sticky-c2 { left: 88px; min-width: 72px; width: 72px; }
.zhifa-table.court-freeze .sticky-c3 {
  left: 160px; min-width: 108px; width: 108px;
  box-shadow: 4px 0 8px -4px rgba(25, 33, 47, 0.18);
}
.zhifa-table.court-freeze tbody tr:hover .sticky-c1,
.zhifa-table.court-freeze tbody tr:hover .sticky-c2,
.zhifa-table.court-freeze tbody tr:hover .sticky-c3 {
  background: var(--card-hover-fill);
}
.zhifa-table.court-freeze th.th-wrap {
  white-space: normal; line-height: 1.25; vertical-align: bottom;
  max-width: 5.2em; min-width: 4.2em; padding-left: 6px; padding-right: 6px;
}
.zhifa-table.court-freeze th.th-wrap .zhifa-tip { margin-left: 2px; }
.zhifa-table.court-freeze td.num-compact { padding-left: 6px; padding-right: 6px; }
.zhifa-table.court-freeze td.desc-cell {
  max-width: 220px; min-width: 160px; padding-top: 8px; padding-bottom: 8px;
  font-size: 12px; line-height: 1.4; color: var(--ink); vertical-align: middle;
}
.zhifa-table.court-freeze .desc-clamp {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden; white-space: normal; word-break: break-word;
  max-height: 2.8em; cursor: help;
}
.table-tooltip.desc-tip {
  max-width: min(480px, calc(100vw - 24px));
  white-space: pre-wrap; line-height: 1.5;
}
.category-toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 14px;
}
.category-toolbar > h3 { margin: 0; }
.category-toolbar .zhifa-btn { flex: none; }

.zhifa-att { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.zhifa-att span { font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.zhifa-att .pass { background: color-mix(in srgb, var(--positive) 14%, var(--surface)); color: var(--positive); }
.zhifa-att .fail { background: color-mix(in srgb, var(--negative) 14%, var(--surface)); color: var(--negative); }
.zhifa-att .pending { background: var(--control); color: var(--muted); }

.zhifa-matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.zhifa-matrix th, .zhifa-matrix td { padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--divider); }
.zhifa-matrix thead th { background: var(--metric); color: var(--muted); font-weight: 500; font-size: 12px; border-bottom: 0; }
.zhifa-matrix thead th:first-child { border-start-start-radius: var(--metric-radius); text-align: left; }
.zhifa-matrix thead th:last-child { border-start-end-radius: var(--metric-radius); }
.zhifa-matrix td:first-child { text-align: left; color: var(--muted); }
.zhifa-matrix tr.hl td { background: var(--selected); }
.zhifa-matrix td.good { color: var(--positive); font-weight: 700; }
.zhifa-matrix td.bad { color: var(--negative); font-weight: 700; }
.zhifa-matrix th.xf, .zhifa-matrix td.xf { background: var(--selected); font-weight: 700; }
.dialect-cell { cursor: pointer; }
.dialect-cell:hover { background: var(--card-hover-fill); }
.dialect-guard {
  font-weight: 500; color: var(--on-selected); margin-bottom: 10px !important;
  padding: 8px 12px; background: var(--selected); border-radius: 6px; font-size: 13px;
}
.dialect-guard.inline {
  display: inline-block; margin: 0 0 0 auto !important; padding: 4px 10px; font-size: 12px; font-weight: 500;
  line-height: 18px; white-space: nowrap;
}
.dialect-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 0 10px;
}
.dialect-head h3 { margin: 0; }

/* ───────── Tooltip（固定定位，避免被横向滚动容器裁切） ───────── */
.zhifa-tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; margin-left: 4px; border-radius: 50%;
  font-size: 11px; font-weight: 700; line-height: 1;
  border: 1px solid var(--subtle); color: var(--subtle); cursor: help; vertical-align: middle;
}
.zhifa-tip:hover, .zhifa-tip:focus-visible { color: var(--blue); border-color: var(--blue); outline: none; }
.table-tooltip {
  position: fixed; z-index: 60; max-width: min(420px, calc(100vw - 16px)); padding: 8px 10px;
  border-radius: 6px; background: var(--ink); color: var(--surface);
  font-size: 12px; line-height: 18px; font-weight: 400; pointer-events: none; text-align: left; white-space: normal;
}
.table-tooltip .stage-line { margin: 0 0 6px; }
.table-tooltip .stage-line:last-child { margin-bottom: 0; }
.table-tooltip .stage-lv { font-weight: 700; color: #8fb2ff; }

/* ───────── 区域页：Masthead / BG Tab / 筛选 ───────── */
.masthead {
  position: sticky; top: 0; z-index: 40; padding: 12px 24px 12px;
  background: var(--surface); border-bottom: 1px solid var(--canvas);
  overflow: visible;
}
.masthead-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.masthead-actions {
  display: flex; flex: none; align-items: center; justify-content: flex-end; gap: 12px; margin-left: auto;
}
.masthead .subtitle {
  margin: 0; color: var(--muted); font-size: 13px; line-height: 22px; white-space: nowrap; text-align: right;
}
.masthead .subtitle time { font-variant-numeric: tabular-nums; }
.masthead-actions .subtitle { margin: 0; }
.bg-tabs {
  display: inline-flex; flex: none; gap: 2px; padding: 3px; margin: 0;
  border-radius: 8px; background: var(--selected);
}
.bg-tab {
  appearance: none; border: 0; background: transparent; color: var(--on-selected);
  font: inherit; font-weight: 600; padding: 6px 16px; border-radius: 6px; cursor: pointer;
}
.bg-tab:hover { background: rgba(62, 121, 240, 0.12); }
.bg-tab.active { background: var(--blue); color: #fff; }
:root[data-theme="dark"] .bg-tab.active { color: #fff; }
/* 第二行：标题居左（对齐侧栏）；筛选+更新时间整体右齐主区右缘（更新时间最右） */
.masthead-toolbar {
  display: grid; grid-template-columns: 200px minmax(0, 1fr); align-items: center; gap: 12px;
  margin-top: 10px; min-width: 0;
}
.masthead-toolbar h1 {
  margin: 0; font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.025em;
}
.masthead-toolbar-main {
  display: flex; flex-wrap: nowrap; align-items: center; justify-content: flex-end; gap: 12px;
  min-width: 0; overflow: visible;
}
.masthead-toolbar .context {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 12px;
  margin: 0; min-width: 0; max-width: 100%; overflow: visible;
}
.masthead-toolbar .masthead-updated {
  margin: 0; flex: none; text-align: right; white-space: nowrap;
}
.context { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.context[hidden] { display: none; }
@media (max-width: 960px) {
  .masthead-toolbar { grid-template-columns: minmax(0, 1fr); }
  .masthead-toolbar-main { justify-content: flex-start; }
  .masthead-toolbar .context { justify-content: flex-start; }
}
.filter-field { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); position: relative; z-index: 1; }
.filter-field:focus-within { z-index: 45; }
.filter-field .zhifa-select { width: 168px; color: var(--ink); }
.filter-field.region .zhifa-select { width: 200px; }
.stage-btn { text-align: left; width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.court-btn { width: 220px; }
.filter-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 50; min-width: 240px; padding: 4px;
  background: var(--surface); border-radius: 8px; box-shadow: 0 6px 16px #19212f1a;
}
.filter-menu[hidden] { display: none; }
.filter-option {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 6px 8px;
  border-radius: 4px; color: var(--ink); font-size: 14px; cursor: pointer;
}
.filter-option:hover { background: var(--control); }
.filter-option input { accent-color: var(--blue); }
.filter-option-all {
  border-bottom: 1px solid var(--line); margin-bottom: 2px; padding-bottom: 8px; font-weight: 600; color: var(--ink);
}
.court-menu { max-height: 280px; overflow: auto; min-width: 260px; }
.filter-empty { padding: 10px 12px; color: var(--subtle); font-size: 13px; }
.bg-empty { margin: 48px 28px; text-align: center; }
.bg-empty .cap { margin-top: 10px; }

/* ───────── 区域页：左导航 + 主区 ───────── */
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: calc(100vh - 190px); }
.side-nav { padding: 12px 9px; background: var(--surface); border-inline-end: 1px solid var(--canvas); }
.side-nav-inner { position: sticky; top: calc(var(--masthead-h, 190px) + 12px); display: flex; flex-direction: column; gap: 2px; }
.side-nav h2 { padding: 9px 8px 5px; font-size: 12px; font-weight: 400; line-height: 16px; color: var(--subtle); }
.side-nav .line-title {
  display: flex; align-items: center; gap: 9px; padding: 8px; color: var(--ink); font-size: 14px; line-height: 22px;
}
.side-nav a.product-link {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 8px 8px 20px; border-radius: 7px;
  color: var(--ink); text-decoration: none;
}
.side-nav a.product-link[aria-current="location"] { background: var(--control); }
@media (hover: hover) { .side-nav a.product-link:hover { background: var(--card-hover-fill); } }
.product-icon {
  display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 6px;
  background: var(--icon-bg); color: var(--blue); font-size: 12px; font-weight: 700;
}
.line-title .product-icon, .side-nav a[aria-current="location"] .product-icon { background: var(--blue); color: var(--surface); }

main.board-main { width: 100%; padding: 24px; min-width: 0; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
@media (max-width: 1100px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.summary > div {
  display: grid; grid-template-rows: auto auto auto; row-gap: 4px; min-width: 0; min-height: 96px;
  padding: 18px 20px; background: var(--surface); border-radius: 8px;
}
.summary dt,
.metric .m-name {
  display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap;
  font: inherit; font-size: 14px; font-weight: 500; line-height: 22px; color: var(--ink);
}
.summary dt .label-text,
.metric .m-name .label-text { min-width: 0; }
.summary dd { font-family: var(--font-num); font-size: 28px; line-height: 32px; font-variant-numeric: tabular-nums; }
.summary small { font-size: 12px; line-height: 18px; color: var(--subtle); }

.line-heading {
  display: flex; align-items: center; flex-wrap: nowrap; gap: 4px 10px;
  margin-bottom: 13px; padding-inline-start: calc(var(--panel-radius) / 2);
}
.line-heading .product-icon { align-self: center; background: var(--blue); color: var(--surface); }
.line-heading-text { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; min-width: 0; }
.line-heading h2 { margin: 0; font-size: 18px; font-weight: 500; line-height: 28px; }
.line-heading-text .zhifa-tip { align-self: center; }
.attainment { display: inline-flex; align-items: baseline; gap: 8px; color: var(--subtle); font-size: 13px; white-space: nowrap; }
.attainment > span + span { position: relative; padding-left: 8px; }
.attainment > span + span::before {
  content: ""; position: absolute; left: 0; top: 50%; width: 1px; height: 9px;
  transform: translateY(-50%); background: var(--divider);
}
.product-detail-link {
  display: inline-flex; align-items: center; align-self: center; gap: 4px; min-height: 32px;
  margin-inline-start: auto; padding: 0 12px; border-radius: 8px;
  background: color-mix(in srgb, var(--blue) 10%, var(--surface)); color: var(--blue);
  font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;
}
.product-detail-link:hover { background: color-mix(in srgb, var(--blue) 18%, var(--surface)); }
.product-detail-link:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.product-detail-link svg { flex: none; }

    if (trad <= 0) return null;
    return { value: (trad - smart) / trad, trad: trad, smart: smart, weight: weight };
  }

  function attainmentCount(courts, targets) {
    targets = targets || {};
    var total = (courts || []).length;
    var dual = 0;
    var usagePass = 0;
    var efficiencyPass = 0;
    (courts || []).forEach(function (c) {
      var chips = attainmentChips(c, targets);
      if (chips.usage === 'pass') usagePass += 1;
      if (chips.efficiency === 'pass') efficiencyPass += 1;
      if (chips.usage === 'pass' && chips.efficiency === 'pass') dual += 1;
    });
    return { dual: dual, usagePass: usagePass, efficiencyPass: efficiencyPass, total: total };
  }

  /**
   * PRD §2.4 第 4 条：指标达标率 = 达标单元 / 有目标且有数的单元
   * 单元 = 法院 × {使用率, 效率提升}；无数或无目标（pending）不进分母
   */
  function indicatorAttainmentRate(courts, targets) {
    targets = targets || {};
    var pass = 0;
    var denom = 0;
    (courts || []).forEach(function (c) {
      var chips = attainmentChips(c, targets);
      ['usage', 'efficiency'].forEach(function (k) {
        if (chips[k] === 'pass') { pass += 1; denom += 1; }
        else if (chips[k] === 'fail') { denom += 1; }
      });
    });
    return { rate: denom > 0 ? pass / denom : null, pass: pass, denom: denom };
  }

  function groupByProvince(courts) {
    var map = {};
    (courts || []).forEach(function (c) {
      var p = c.province || '未知';
      if (!map[p]) map[p] = [];
      map[p].push(c);
    });
    return Object.keys(map).map(function (province) {
      var list = map[province];
      var usage = aggregateUsage(list);
      var efficiency = aggregateEfficiency(list);
      return {
        province: province,
        count: list.length,
        courts: list,
        usage: usage ? usage.value : null,
        efficiency: efficiency ? efficiency.value : null,
        usageAgg: usage,
        efficiencyAgg: efficiency
      };
    }).sort(function (a, b) {
      return (b.usage || 0) - (a.usage || 0);
    });
  }

  /** 按周期取样板（产品页再叠省/阶段/法院用 filterCourts） */
  function productCourtScope(courts, period) {
    return (courts || []).filter(function (c) {
      if (period && c.period && c.period !== period) return false;
      return true;
    });
  }

  function productKpis(courts, targets) {
    var list = courts || [];
    var usage = aggregateUsage(list);
    var efficiency = aggregateEfficiency(list);
    var dual = attainmentCount(list, targets);
    var iar = indicatorAttainmentRate(list, targets);
    return {
      courtCount: list.length,
      usage: usage,
      efficiency: efficiency,
      dualCount: dual,
      indicatorAttainment: iar
    };
  }

  /** 方言达标单元格数（≥ target；`/` / null 不进分母） */
  function dialectPassCells(dialectRows, period, target) {
    var m = dialectMatrix(dialectRows, period);
    var pass = 0;
    var total = 0;
    (m.rows || []).forEach(function (r) {
      (m.accents || []).forEach(function (a) {
        var v = r.cells[a];
        if (v == null || v === '/') return;
        total += 1;
        if (target != null && v >= target) pass += 1;
      });
    });
    return { pass: pass, total: total };
  }

  function dialectMatrix(dialectRows, period) {
    var accents = ['口音一般', '口音明显', '方言'];
    var byProv = {};
    (dialectRows || []).forEach(function (r) {
      if (period && r.period && r.period !== period) return;
      if (!byProv[r.province]) {
        byProv[r.province] = { province: r.province, cells: {} };
      }
      var cell = r.acc;
      if (cell == null) cell = '/';
      byProv[r.province].cells[r.accent] = cell;
    });
    var rows = Object.keys(byProv)
      .sort()
      .map(function (p) {
        accents.forEach(function (a) {
          if (!(a in byProv[p].cells)) byProv[p].cells[a] = '/';
        });
        return byProv[p];
      });
    return { accents: accents, rows: rows };
  }

  function canExpandCriticalErrors(role) {
    return role === 'lead' || role === 'rd';
  }

  /**
   * 近多季趋势（随省 ∩ 阶段 ∩ 法院）
   * - 当期季：当前筛选样板按 §2.4 聚合
   * - 历史季：TREND_DEMO ×（当前范围/全国同阶段基线）缩放，须标演示
   * - 全国基线：同阶段、不限省/法院（用于缩放系数）
   */
  function scopedMetricTrend(opts) {
    opts = opts || {};
    var metric = opts.metric === 'usage' ? 'usage' : 'efficiency';
    var trendDemo = opts.trendDemo || {};
    var periods = trendDemo.periods || [];
    var base = trendDemo[metric] || [];
    var currentPeriod = opts.currentPeriod;
    var stages = opts.stages && opts.stages.length ? opts.stages : ['__none__'];
    var benches = opts.benchmarks || ['全国', '省级'];
    var allCourts = opts.courts || [];

    function periodFilter(list) {
      return list.filter(function (c) {
        return !currentPeriod || !c.period || c.period === currentPeriod;
      });
    }

    function scopedFilter() {
      var fo = { stages: stages, benchmarks: benches };
      if (Object.prototype.hasOwnProperty.call(opts, 'provinces')) fo.provinces = opts.provinces;
      else if (opts.province) fo.province = opts.province;
      if (Object.prototype.hasOwnProperty.call(opts, 'courtIds')) fo.courtIds = opts.courtIds;
      return periodFilter(filterCourts(allCourts, fo));
    }

    var national = periodFilter(filterCourts(allCourts, {
      stages: stages,
      benchmarks: benches
    }));
    var scoped = scopedFilter();
    var natAgg = metric === 'usage' ? aggregateUsage(national) : aggregateEfficiency(national);
    var scAgg = metric === 'usage' ? aggregateUsage(scoped) : aggregateEfficiency(scoped);

    if (!scAgg || periods.length < 2 || base.length < 2) {
      return {
        periods: periods,
        values: null,
        empty: true,
        sourceType: 'demo',
        currentValue: scAgg ? scAgg.value : null
      };
    }

    var ratio = natAgg && natAgg.value > 0 ? scAgg.value / natAgg.value : 1;
    var values = base.map(function (v, i) {
      if (periods[i] === currentPeriod) return scAgg.value;
      var scaled = v * ratio;
      if (scaled < 0) return 0;
      if (scaled > 1) return 1;
      return scaled;
    });

    return {
      periods: periods,
      values: values,
      empty: false,
      sourceType: 'demo',
      currentValue: scAgg.value,
      ratio: ratio,
      scopedCourtCount: scoped.length
    };
  }

  return {
    filterCourts: filterCourts,
    courtOptionList: courtOptionList,
    sortCourts: sortCourts,
    attainmentChips: attainmentChips,
    buildRecommendations: buildRecommendations,
    accessRate: accessRate,
    buildExportRows: buildExportRows,
    scopedMetricTrend: scopedMetricTrend,
    toCsv: toCsv,
    computeAccessSlots: computeAccessSlots,
    aggregateUsage: aggregateUsage,
    aggregateEfficiency: aggregateEfficiency,
    attainmentCount: attainmentCount,
    indicatorAttainmentRate: indicatorAttainmentRate,
    groupByProvince: groupByProvince,
    productCourtScope: productCourtScope,
    productKpis: productKpis,
    dialectPassCells: dialectPassCells,
    dialectMatrix: dialectMatrix,
    canExpandCriticalErrors: canExpandCriticalErrors
  };
});

<script>

    usage: 'AI书记员开庭使用率 = AI书记员开庭次数 ÷ 开庭次数。范围汇总 = Σ分子 ÷ Σ分母。目标 ≥' + pctInt(D.TARGETS.usage) + '；有目标才按数值着色（达标绿 / 未达标红）。',
    efficiency: '智慧法庭效率提升 = (传统平均时长 − 智慧平均时长) ÷ 传统平均时长。范围值按开庭次数加权传统/智慧时长后重算。目标 ≥相对 ' + pctInt(D.TARGETS.efficiency) + '；有目标才按数值着色（达标绿 / 未达标红）。',

  function pctInt(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }

  function esc(s) {

  function tip(key, label) {
    return '<span class="zhifa-tip" tabindex="0" data-tip="' + key + '" role="img" aria-label="' +
      esc(label || '指标定义') + '">?</span>';
  }
  function $(id) { return document.getElementById(id); }

  /* ── URL / 导航 ── */
  function encodeList(val) {
    if (val === null) return '*';
    if (!val.length) return '__empty__';
    return val.join(',');
  }
  function syncUrl() {
    var p = new URLSearchParams();
    p.set('bg', state.bg);
    p.set('role', state.role);
    if (state.bg === 'zhifa') {
      p.set('period', state.period);
      p.set('provinces', encodeList(state.provinces));
      p.set('stages', state.stages.join(','));
      p.set('courts', encodeList(state.courtIds));
    }
    history.replaceState(null, '', location.pathname + '?' + p.toString());
  }
  function productHref(extra) {
    var p = new URLSearchParams();
    p.set('role', state.role);
    p.set('period', state.period);
    p.set('provinces', encodeList(state.provinces));
    p.set('stages', state.stages.join(','));
    p.set('courts', encodeList(state.courtIds));
    if (extra && extra.highlightProvince) {
      p.set('provinces', extra.highlightProvince);
      p.set('anchor', extra.anchor || 'dialect');
    } else if (extra && extra.anchor) {
      p.set('anchor', extra.anchor);

  /* ── 数据范围 ── */
  function provinceOptions() {

  }
  function scopeLabelProvinces() {

  }

  function renderProductAttainment(courts) {
    var keys = ['efficiency', 'usage'];

  function renderKpis(courts) {

      { n: '样板法院数', tip: 'kpi_courts', v: String(courts.length), s: '当前范围 · 样板点，非全量' },

      function open() { openMetric(el.getAttribute('data-metric')); }

  /* ── 指标 Dialog ── */
  function trendSvg(vals, periods, target) {
    var w = 520, h = 250, pad = { l: 46, r: 30, t: 22, b: 30 };
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b, n = periods.length;
    var all = vals.concat([target]);
    var lo = Math.max(0, Math.min.apply(null, all) - 0.08);
    var hi = Math.min(1, Math.max.apply(null, all) + 0.08);
    function xAt(i) { return pad.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw); }
    function yAt(v) { return pad.t + (1 - (v - lo) / (hi - lo)) * ih; }
    var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="近多季趋势（演示数据）">';
    [lo, (lo + hi) / 2, hi].forEach(function (g) {
      svg += '<line class="axis" x1="' + pad.l + '" x2="' + (pad.l + iw) + '" y1="' + yAt(g).toFixed(1) + '" y2="' + yAt(g).toFixed(1) + '"/>' +
        '<text class="tick" x="' + (pad.l - 6) + '" y="' + (yAt(g) + 4).toFixed(1) + '" text-anchor="end">' + Math.round(g * 100) + '%</text>';
    });
    svg += '<line class="chart-target" x1="' + pad.l + '" x2="' + (pad.l + iw) + '" y1="' + yAt(target).toFixed(1) + '" y2="' + yAt(target).toFixed(1) + '"/>';
    svg += '<polyline class="series" points="' + vals.map(function (v, i) { return xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1); }).join(' ') + '"/>';
    periods.forEach(function (p, i) {
      svg += '<circle class="dot" cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(vals[i]).toFixed(1) + '" r="3.5"/>' +
        '<text class="tick" x="' + xAt(i).toFixed(1) + '" y="' + (yAt(vals[i]) - 9).toFixed(1) + '" text-anchor="middle" style="fill:var(--ink)">' + (vals[i] * 100).toFixed(0) + '%</text>' +
        '<text class="tick" x="' + xAt(i).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + p + '</text>';
    });
    return svg + '</svg>';
  }

  function rankItems(key, courts) {
    var m = METRICS[key];
    var list = courts.filter(function (c) { return c[key] != null; }).map(function (c) {
      return { name: c.name, v: c[key] };
    });
    var sorted = list.slice().sort(function (a, b) { return b.v - a.v; });
    var items = state.rankMode === 'top' ? sorted.slice(0, 10) : sorted.slice().reverse().slice(0, 10);
    var max = Math.max(m.target, 0.01);
    list.forEach(function (x) { max = Math.max(max, x.v); });
    return { items: items, max: max, total: list.length };
  }
  function renderRank() {
    var key = state.metricKey;
    if (!key) return;
    var m = METRICS[key];
    var r = rankItems(key, filteredCourts());
    var body = $('rankBody');
    if (!r.total) { body.innerHTML = '<div class="zhifa-empty soft">当前筛选下暂无样板法院</div>'; return; }
    var html = '<div class="court-ranks">';
    r.items.forEach(function (x) {
      html += '<div class="court-rank"><span class="court-name" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
        '<span class="court-result"><span class="court-bar ' + (state.rankMode === 'bottom' ? 'is-bottom' : '') + '" style="width:' + (x.v / r.max * 100).toFixed(1) + '%"></span>' +
        '<span class="court-target" style="left:' + (m.target / r.max * 100).toFixed(1) + '%"></span></span>' +
        '<span class="court-value ' + tone(x.v, m.target) + '">' + pct(x.v) + '</span></div>';
    });
    html += '</div>';
    if (r.total <= 10) html += '<div class="detail-note">当前仅 ' + r.total + ' 家样板法院，前 10 / 后 10 为同一集合的两种排序。</div>';
    body.innerHTML = html;
    document.querySelectorAll('#rankSwitch button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-rank') === state.rankMode ? 'true' : 'false');

  function openMetric(key) {

  function csvCell(v) {

  function exportCourtsExcel() {
    var courts = filteredCourts();
    if (!courts.length) return;
    var headers = [
      '省', '市/区', '法院', '阶段', '标杆类型', '开庭次数', 'AI书记员开庭次数',
      'AI书记员开庭使用率', '传统平均时长（分钟）', '智慧平均时长（分钟）',
      '智慧法庭效率提升', '使用率说明', '效率说明'
    ];
    var lines = [headers.map(csvCell).join(',')];
    courts.forEach(function (c) {
      lines.push([
        c.province, c.city, c.name, stageLabel(c.stage), c.benchmark,
        c.usageDen, c.usageNum, pct(c.usage),
        c.tradMin == null ? '' : c.tradMin,
        c.smartMin == null ? '' : c.smartMin,
        pct(c.efficiency),
        c.usageDesc || '', c.efficiencyDesc || ''
      ].map(csvCell).join(','));
    });
    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '样板法院明细_' + state.period + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

  /* ── Tooltip（固定定位） ── */
  function initTooltip() {
    var el = document.createElement('div');
    el.className = 'table-tooltip';
    el.hidden = true;
    document.body.appendChild(el);
    function place(target) {
      var r = target.getBoundingClientRect();
      var w = el.offsetWidth, h = el.offsetHeight;
      var left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
      var top = r.bottom + 8;
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }
    function showTip(target) {
      var html = TIPS[target.getAttribute('data-tip')];
      if (!html) return;
      el.classList.remove('desc-tip');
      el.innerHTML = html;
      el.hidden = false;
      place(target);
    }
    function showFull(target) {
      var full = target.getAttribute('data-full');
      if (full == null || full === '') return;
      el.classList.add('desc-tip');
      el.textContent = full.replace(/&#10;/g, '\n');
      el.hidden = false;
      place(target);
    }
    function hide() { el.hidden = true; el.classList.remove('desc-tip'); }
    document.addEventListener('mouseover', function (e) {
      var tipEl = e.target.closest && e.target.closest('[data-tip]');
      if (tipEl) { showTip(tipEl); return; }
      var fullEl = e.target.closest && e.target.closest('[data-full]');
      if (fullEl) showFull(fullEl);
    });
    document.addEventListener('mouseout', function (e) {
      if ((e.target.closest && e.target.closest('[data-tip]')) ||
          (e.target.closest && e.target.closest('[data-full]'))) hide();
    });
    document.addEventListener('focusin', function (e) {
      var tipEl = e.target.closest && e.target.closest('[data-tip]');
      if (tipEl) { showTip(tipEl); return; }
      var fullEl = e.target.closest && e.target.closest('[data-full]');
      if (fullEl) showFull(fullEl);
    });
    document.addEventListener('focusout', hide);
    window.addEventListener('scroll', hide, true);
  }

  function bindMsToggle(btnId, panelId) {

    $(panelId).addEventListener('click', stop);
    $(panelId).addEventListener('mousedown', stop);
  }

      });
    });
    $('btnReset').addEventListener('click', function () {
      state.period = D.PERIODS[0];
      state.provinces = null;
      state.stages = ['L3', 'L4', 'L5'];
      state.courtIds = null;
      closeDialogs();
      closeFilterMenus();
      renderAll();
    });
    $('btnTheme').addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (dark) document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      closeFilterMenus();
      closeDialogs();
    });
    window.addEventListener('resize', syncMastheadHeight);
    renderAll();
  }

  init();
})();
</script>
</body>
</html>
